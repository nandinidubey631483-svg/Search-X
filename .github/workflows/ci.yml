name: SearchX CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. C++ Core Retrieval Engine (Cross-Platform Matrix: Linux & Windows)
  # ============================================================================
  cxx-engine:
    name: C++ Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ninja Build System
        uses: ashutoshvarma/setup-ninja@v1.1
        with:
          version: 1.11.1

      - name: Configure CMake
        run: |
          cmake -B core-engine/build -S core-engine -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Core Engine & Test Binaries
        run: |
          cmake --build core-engine/build --config Release

      - name: Run CTest Unit & Inverted Index Verification Suites
        run: |
          ctest --test-dir core-engine/build --output-on-failure -C Release

  # ============================================================================
  # 2. Python Backend & Web Crawler (Pytest Matrix)
  # ============================================================================
  python-backend:
    name: Python Backend & Crawler (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Setup Ninja Build System
        uses: ashutoshvarma/setup-ninja@v1.1
        with:
          version: 1.11.1

      - name: Compile C++ Engine Binary for Backend Integration
        run: |
          cmake -B core-engine/build -S core-engine -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build core-engine/build --config Release

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-cov

      - name: Run Backend & Crawler Pytest Suites
        env:
          PYTHONPATH: ${{ github.workspace }}
          SEARCHX_ENGINE_BIN: ${{ matrix.os == 'windows-latest' && 'core-engine/build/searchx_engine.exe' || 'core-engine/build/searchx_engine' }}
          SEARCHX_INDEX_PATH: test_ci_index.bin
          DATABASE_URL: sqlite:///test_ci.db
          REDIS_URL: redis://localhost:6379/0
          SEARCHX_CACHE_ENABLED: "false"
        run: |
          python -m pytest backend/tests crawler/tests -v

  # ============================================================================
  # 3. React + Vite Frontend (Vitest & Production Asset Compilation)
  # ============================================================================
  frontend-ci:
    name: React Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Vitest Frontend Test Suites
        run: npm test

      - name: Run Production Bundle Build
        run: npm run build

  # ============================================================================
  # 4. Multi-Stage Docker Image Build & Compose Validation
  # ============================================================================
  docker-validation:
    name: Docker Builds & Compose Schema
    runs-on: ubuntu-latest
    needs: [cxx-engine, python-backend, frontend-ci]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Backend Multi-Stage Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: searchx-backend:ci

      - name: Build Frontend Multi-Stage Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: searchx-frontend:ci
